<title>Typewriter Keys 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Gelasio&family=Inter:wght@400;600&display=swap">
<style>
  /* Layout: one phone-width column — a sheet of paper on top, the keyboard tray pinned under it. */
  :root {
    --desk: #eceef1;
    --paper: #fbfaf6;
    --ink: #1d1d20;
    --muted: #6b6e76;
    --tray: #d9dade;
    --rule: #c9cbd1;
    --accent: #a8262c;
    --type: "Special Elite", "Courier New", monospace;
    --ui: Inter, system-ui, sans-serif;
  }
  body {
    background: var(--desk);
    color: var(--ink);
    font-family: var(--ui);
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .column { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--type); font-size: 1.35rem; font-weight: 400; margin: 0; }
  label { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
  input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #paper {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    min-height: 7.5rem;
    padding: 16px 18px;
    font-family: var(--type);
    font-size: 1.15rem;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #paper .hint { color: var(--muted); }
  #caret { display: inline-block; width: 0.55em; height: 1.05em; background: var(--accent); vertical-align: text-bottom; opacity: 0.75; }
  #tray {
    background: var(--tray);
    border-radius: 22px;
    overflow: hidden;
    aspect-ratio: 1.68;
    max-width: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #tray canvas { display: block; width: 100%; height: 100%; }
  p.note { margin: 0; font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
</style>

<div class="column">
  <header>
    <h1>Typewriter Keys 3D</h1>
    <label for="sound"><input type="checkbox" id="sound" checked> Sound</label>
  </header>
  <div id="paper" aria-live="polite"><span id="typed"></span><span id="caret"></span><span class="hint" id="hint"> tap the keys below</span></div>
  <div id="tray"></div>
  <p class="note">Design prototype for the Android keyboard. Letters, shift, space, backspace and return work; 123 and the smiley only animate.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const tray = document.getElementById('tray');
  const typedEl = document.getElementById('typed');
  const hintEl = document.getElementById('hint');
  const soundEl = document.getElementById('sound');

  // ---- layout, measured from the reference (unit = one key pitch) ----------
  const ROW = 1.167, D = 0.9, CAP_Z = 0.58, CORNER = 0.38;
  const INK = '#dcd9cf';
  const L = (label, cx) => ({ label, cx });
  const rows = [
    'QWERTYUIOP'.split('').map((c, i) => L(c, 0.5 + i)),
    'ASDFGHJKL'.split('').map((c, i) => L(c, 1 + i)),
    [{ icon: 'shift', cx: 0.695, w: 1.25 }].concat('ZXCVBNM'.split('').map((c, i) => L(c, 2 + i)), [{ icon: 'backspace', cx: 9.32, w: 1.29, red: true }]),
    [{ label: '123', cx: 0.71, w: 1.32 }, { icon: 'emoji', cx: 2 }, { icon: 'space', cx: 5.01, w: 4.83 }, { icon: 'enter', cx: 8.78, w: 2.36 }],
  ];

  // ---- renderer ------------------------------------------------------------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.5));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  tray.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xd6d7db);
  const VIEW_W = 10.9, VIEW_CY = -1.62;
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 100);
  camera.position.set(5, VIEW_CY, 40);
  camera.lookAt(5, VIEW_CY, 0);

  // Soft studio reflections for the metal.
  (function () {
    const env = new THREE.Scene();
    env.background = new THREE.Color(0x25262a);
    const panel = (w, h, x, y, z, c) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
    };
    panel(10, 6, -6, 6, 8, 0xd0d0d0);
    panel(6, 6, 8, -6, 6, 0x6a6b70);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, 0.08).texture;
  })();

  // Key light from the upper left, split into a small cluster so shadows fall soft to the lower right.
  scene.add(new THREE.HemisphereLight(0xffffff, 0xc4c6cc, 0.44));
  [[0, 0], [0.9, 0.3], [-0.9, -0.3], [0.3, -0.9], [-0.3, 0.9], [0.6, 0.6], [-0.6, -0.6]].forEach(o => {
    const sun = new THREE.DirectionalLight(0xffffff, 0.095);
    sun.position.set(5 - 4.6 + o[0], VIEW_CY + 4.2 + o[1], 8);
    sun.target.position.set(5, VIEW_CY, 0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 6, bottom: -6, near: 1, far: 30 });
    sun.shadow.bias = -0.002;
    sun.shadow.radius = 3;
    scene.add(sun, sun.target);
  });

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: new THREE.Color(0xdcdde1).convertSRGBToLinear(), roughness: 1, metalness: 0, envMapIntensity: 0 }));
  ground.receiveShadow = true;
  scene.add(ground);

  // ---- materials -----------------------------------------------------------
  // r128 treats material colours as linear, so convert from the sRGB values we pick by eye.
  const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
  const std = (color, metalness, roughness, env) => new THREE.MeshStandardMaterial({ color: lin(color), metalness, roughness, envMapIntensity: env });
  const rimMat = std(0x3b3c40, 0.6, 0.4, 0.9);
  const lipMat = std(0xb0afab, 0.2, 0.7, 0.3);
  const bodyMat = std(0x18181a, 0.2, 0.6, 0.3);
  const stemMat = std(0x2b2c2f, 0.45, 0.5, 0.6);
  const barMat = std(0x343538, 0.5, 0.5, 0.6);
  const hookMat = std(0x2e2f32, 0.5, 0.5, 0.6);
  const tipMat = std(0x101012, 0.3, 0.6, 0.2);

  function rrect(w, h, r, inset, target) {
    const hw = w / 2 - inset, hh = h / 2 - inset, rr = Math.max(0.01, Math.min(r - inset, hw, hh));
    const s = target || new THREE.Shape();
    s.moveTo(hw - rr, -hh);
    s.absarc(hw - rr, -hh + rr, rr, -Math.PI / 2, 0, false);
    s.absarc(hw - rr, hh - rr, rr, 0, Math.PI / 2, false);
    s.absarc(-hw + rr, hh - rr, rr, Math.PI / 2, Math.PI, false);
    s.absarc(-hw + rr, -hh + rr, rr, Math.PI, Math.PI * 1.5, false);
    s.closePath();
    return s;
  }

  const FONT = 'Gelasio, Georgia, "Times New Roman", "Noto Serif", serif';
  function faceTexture(key, fw, fh) {
    const H = 256, W = Math.round(H * fw / fh);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = key.red ? '#640f15' : '#131315'; g.fillRect(0, 0, W, H);
    const ink = key.red ? '#e6c9c4' : INK;
    g.fillStyle = ink; g.strokeStyle = ink; g.lineCap = 'round'; g.lineJoin = 'round';
    g.translate(W / 2, H / 2);
    const u = H * (key.icon && key.icon !== 'emoji' ? 0.7 : 0.56);
    if (key.label) {
      g.font = (key.label.length > 1 ? H * 0.58 : H * 0.74) + 'px ' + FONT;
      g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      const m = g.measureText(key.label);
      const asc = m.actualBoundingBoxAscent || H * 0.4, desc = key.label === 'Q' || key.label === 'J' ? 0 : (m.actualBoundingBoxDescent || 0);
      g.fillText(key.label, 0, (asc - desc) / 2);
    } else if (key.icon === 'shift') {
      g.lineWidth = u * 0.06; g.beginPath();
      [[0, -0.42], [0.36, -0.04], [0.17, -0.04], [0.17, 0.34], [-0.17, 0.34], [-0.17, -0.04], [-0.36, -0.04]].forEach((p, i) => g[i ? 'lineTo' : 'moveTo'](p[0] * u, p[1] * u));
      g.closePath(); g.stroke();
    } else if (key.icon === 'backspace') {
      g.lineWidth = u * 0.06; g.beginPath();
      [[-0.5, 0], [-0.22, -0.32], [0.42, -0.32], [0.42, 0.32], [-0.22, 0.32]].forEach((p, i) => g[i ? 'lineTo' : 'moveTo'](p[0] * u, p[1] * u));
      g.closePath(); g.stroke(); g.beginPath();
      g.moveTo(-0.02 * u, -0.13 * u); g.lineTo(0.24 * u, 0.13 * u); g.moveTo(0.24 * u, -0.13 * u); g.lineTo(-0.02 * u, 0.13 * u); g.stroke();
    } else if (key.icon === 'enter') {
      g.lineWidth = u * 0.055; g.beginPath();
      g.moveTo(0.06 * u, -0.3 * u); g.lineTo(0.42 * u, -0.3 * u); g.lineTo(0.42 * u, 0.12 * u); g.lineTo(-0.4 * u, 0.12 * u);
      g.moveTo(-0.18 * u, -0.1 * u); g.lineTo(-0.4 * u, 0.12 * u); g.lineTo(-0.18 * u, 0.34 * u); g.stroke();
    } else if (key.icon === 'emoji') {
      g.lineWidth = u * 0.06; g.beginPath(); g.arc(0, 0, 0.4 * u, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.arc(0, 0.04 * u, 0.24 * u, 0, Math.PI); g.closePath(); g.fill();
      g.beginPath(); g.arc(-0.15 * u, -0.13 * u, 0.05 * u, 0, 7); g.arc(0.15 * u, -0.13 * u, 0.05 * u, 0, 7); g.fill();
    }
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // ---- build ---------------------------------------------------------------
  const keys = [], pickable = [], bars = [];
  const RIM = 0.064, LIP = 0.013;
  const shadowed = m => { m.castShadow = true; return m; };

  function buildKey(key, row) {
    const w = key.w || D, r = key.w ? CORNER : D / 2;
    const group = new THREE.Group();
    group.position.set(key.cx, -row * ROW, CAP_Z);

    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rrect(w, D, r, 0.012), { depth: 0.2, bevelEnabled: false, curveSegments: 20 }), bodyMat);
    body.position.z = -0.22;
    const rimShape = rrect(w, D, r, 0.026);
    rimShape.holes.push(rrect(w, D, r, RIM, new THREE.Path()));
    const rim = new THREE.Mesh(new THREE.ExtrudeGeometry(rimShape, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.024, bevelSegments: 5, curveSegments: 24 }), rimMat);
    rim.position.z = -0.03;
    const lipShape = rrect(w, D, r, RIM + 0.014);
    lipShape.holes.push(rrect(w, D, r, RIM + 0.014 + LIP, new THREE.Path()));
    const lip = new THREE.Mesh(new THREE.ShapeGeometry(lipShape, 24), lipMat);
    lip.position.z = -0.012;
    const fin = RIM + 0.014 + LIP - 0.004;
    const faceGeo = new THREE.ShapeGeometry(rrect(w, D, r, fin), 24);
    const fw = w - 2 * fin, fh = D - 2 * fin;
    const uv = faceGeo.attributes.uv, pos = faceGeo.attributes.position;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / fw + 0.5, pos.getY(i) / fh + 0.5);
    const face = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({ map: faceTexture(key, fw, fh), roughness: 0.7, metalness: 0, envMapIntensity: 0.15 }));
    face.position.z = -0.016;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, CAP_Z, 10), stemMat);
    post.rotation.x = Math.PI / 2; post.position.z = -CAP_Z / 2 - 0.1;

    [body, rim, lip, face, post].forEach(m => { m.userData.key = key; group.add(m); });
    shadowed(body); shadowed(rim);
    pickable.push(body, rim, face);
    scene.add(group);
    Object.assign(key, { group, row, cy: -row * ROW, p: 0, down: 0 });
    keys.push(key);
  }

  function build() {
    rows.forEach((row, ri) => row.forEach(k => buildKey(k, ri)));

    // Type bars: 17 thin strips running behind every row, each topped with a hairpin hook.
    const BAR_N = 17, BAR_X0 = 1.95, BAR_STEP = 0.378, TOP = 1.3, BOTTOM = -3 * ROW;
    const stripGeo = new THREE.CylinderGeometry(0.05, 0.05, TOP - 0.55 - BOTTOM, 10);
    const headGeo = new THREE.CylinderGeometry(0.063, 0.063, 0.62, 12);
    const tipGeo = new THREE.CylinderGeometry(0.043, 0.043, 0.5, 10);
    const bendGeo = new THREE.TorusGeometry(0.062, 0.05, 8, 14, Math.PI);
    for (let i = 0; i < BAR_N; i++) {
      const g = new THREE.Group();
      g.position.set(BAR_X0 + BAR_STEP * i, 0, 0.1);
      const strip = shadowed(new THREE.Mesh(stripGeo, barMat)); strip.position.y = (TOP - 0.55 + BOTTOM) / 2;
      const head = shadowed(new THREE.Mesh(headGeo, hookMat)); head.position.set(0, TOP - 0.36, 0.02);
      const bend = shadowed(new THREE.Mesh(bendGeo, hookMat)); bend.position.set(-0.062, TOP - 0.06, 0.02);
      const tip = shadowed(new THREE.Mesh(tipGeo, tipMat)); tip.position.set(-0.124, TOP - 0.3, 0.02);
      g.add(strip, head, bend, tip);
      scene.add(g);
      bars.push({ g, kick: 0 });
    }

    // Key stems hang toward the bottom, passing between the keys of the rows below.
    const stemGeo = new THREE.CylinderGeometry(0.052, 0.052, 1, 12);
    const stem = (x, y0, y1) => {
      const m = shadowed(new THREE.Mesh(stemGeo, stemMat));
      m.scale.y = y0 - y1; m.position.set(x, (y0 + y1) / 2, 0.22); scene.add(m);
    };
    keys.forEach(k => {
      k.bar = bars[Math.max(0, Math.min(BAR_N - 1, Math.round((k.cx - 0.5) / 9 * (BAR_N - 1))))];
      if (k.row === 3) return;
      const edge = k.label === 'Q' || k.label === 'P';
      const end = k.row === 0 && !edge ? -3 * ROW : -(k.row + 1) * ROW;
      const x = k.icon === 'shift' ? 0.74 : k.icon === 'backspace' ? 9.2 : k.cx;
      stem(x, k.cy, end);
    });

    // Small pivot clamps where the reference shows them.
    const clampGeo = new THREE.CylinderGeometry(0.085, 0.085, 0.2, 12);
    const capGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.26, 10);
    [[0.5, 1, -1, -0.12], [1.5, 2, -1, 0.26], [1.5, 3, -1, 0.1], [3.5, 2, -1, 0.26], [8.5, 2, 1, 0.26], [9.5, 1, 1, -0.05]].forEach(c => {
      const y = -c[1] * ROW + c[3], x = c[0] + c[2] * 0.11;
      const a = shadowed(new THREE.Mesh(clampGeo, stemMat)); a.rotation.z = Math.PI / 2; a.position.set(x, y, 0.24);
      const b = new THREE.Mesh(capGeo, rimMat); b.rotation.z = Math.PI / 2; b.position.set(x, y, 0.24);
      scene.add(a, b);
    });
    stem(0.5, -ROW * 0.55, -ROW * 2);
    stem(9.5, -ROW * 0.55, -ROW * 2);

    // Space bar linkage: four looped hangers and two ribbed hinge blocks.
    const space = keys.find(k => k.icon === 'space');
    const barBottom = space.cy - D / 2;
    [3.04, 4.22, 6.07, 6.88].forEach(x => {
      const len = 0.62;
      const rod = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, len + 0.3, 10), stemMat));
      rod.position.set(x, barBottom - len / 2 + 0.15, 0.22); scene.add(rod);
      const loop = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.058, 0.032, 8, 16), stemMat));
      loop.scale.y = 1.5; loop.position.set(x, barBottom - len - 0.05, 0.22); scene.add(loop);
    });
    [[3.15, 3.8], [6.2, 6.75]].forEach(b => {
      const w = b[1] - b[0], cx = (b[0] + b[1]) / 2, y = barBottom - 0.17;
      const block = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, 0.3, 0.12), stemMat));
      block.position.set(cx, y, 0.26); scene.add(block);
      for (let i = 0; i < 4; i++) {
        const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.3, 8), rimMat);
        rib.position.set(b[0] + w * (i + 0.5) / 4, y, 0.3); scene.add(rib);
      }
    });
  }

  // ---- camera fit ----------------------------------------------------------
  function resize() {
    const w = tray.clientWidth, h = tray.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    const hw = VIEW_W / 2, hh = hw * h / w;
    Object.assign(camera, { left: -hw, right: hw, top: hh, bottom: -hh });
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(tray);
  resize();

  // ---- typing --------------------------------------------------------------
  let text = '', shift = false, audio = null;

  function click(kind) {
    if (!soundEl.checked) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime, dur = kind === 'bell' ? 0.7 : 0.07;
      const buf = audio.createBuffer(1, audio.sampleRate * 0.07, audio.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audio.sampleRate * 0.006));
      const n = audio.createBufferSource(); n.buffer = buf;
      const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = kind === 'space' ? 900 : 2600 + Math.random() * 500;
      const g = audio.createGain(); g.gain.value = 0.6;
      n.connect(f); f.connect(g); g.connect(audio.destination); n.start(t);
      const o = audio.createOscillator(), og = audio.createGain();
      o.frequency.value = kind === 'bell' ? 2093 : kind === 'space' ? 130 : 190;
      og.gain.setValueAtTime(kind === 'bell' ? 0.25 : 0.35, t); og.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(og); og.connect(audio.destination); o.start(t); o.stop(t + dur);
    } catch (e) { /* no audio available: stay silent */ }
  }

  function strike(key) {
    key.down++;
    key.bar.kick = 1;
    if (key.label && key.label.length === 1) { text += shift ? key.label : key.label.toLowerCase(); shift = false; click('key'); }
    else if (key.icon === 'space') { text += ' '; click('space'); }
    else if (key.icon === 'backspace') { text = text.slice(0, -1); click('key'); }
    else if (key.icon === 'enter') { text += '\n'; click('bell'); }
    else if (key.icon === 'shift') { shift = !shift; click('key'); }
    else click('key');
    typedEl.textContent = text;
    hintEl.hidden = true;
  }

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), held = new Map();
  function keyAt(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickable, false)[0];
    return hit ? hit.object.userData.key : null;
  }
  renderer.domElement.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    const k = keyAt(ev);
    if (!k) return;
    held.set(ev.pointerId, k);
    strike(k);
  });
  const release = ev => { const k = held.get(ev.pointerId); if (k) { k.down = Math.max(0, k.down - 1); held.delete(ev.pointerId); } };
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  window.addEventListener('keydown', ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.repeat) return;
    const k = keys.find(k => (k.label && k.label.length === 1 && k.label === ev.key.toUpperCase()) ||
      (k.icon === 'space' && ev.key === ' ') || (k.icon === 'backspace' && ev.key === 'Backspace') || (k.icon === 'enter' && ev.key === 'Enter'));
    if (!k) return;
    ev.preventDefault();
    if (ev.shiftKey && k.label) shift = true;
    strike(k);
    setTimeout(() => { k.down = Math.max(0, k.down - 1); }, 90);
  });

  // Test hook: hold a key down by label or icon name.
  window.__hold = name => { const k = keys.find(k => k.label === name || k.icon === name); if (k) strike(k); };

  // ---- animation -----------------------------------------------------------
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    keys.forEach(k => {
      const target = k.down > 0 ? 1 : 0;
      k.p += (target - k.p) * Math.min(1, dt * (target ? 45 : 16));
      k.group.position.z = CAP_Z - 0.2 * k.p;
      const s = 1 - 0.035 * k.p; k.group.scale.set(s, s, 1);
    });
    bars.forEach(b => {
      if (b.kick > 0 && !(window.__freeze && b.kick <= 0.5)) b.kick = Math.max(0, b.kick - dt / 0.2);
      const s = still || b.kick <= 0 ? 0 : Math.sin(Math.PI * (1 - b.kick));
      b.g.position.y = s * 0.3;
      b.g.position.z = 0.1 + s * 0.08;
    });
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Wait briefly for the serif face so the key legends are drawn in it.
  const fontReady = document.fonts && document.fonts.load ? document.fonts.load('100px Gelasio').catch(() => {}) : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(() => { build(); window.__ready = true; requestAnimationFrame(frame); }).catch(e => console.error('build failed: ' + (e && e.stack || e)));
})();
</script>
