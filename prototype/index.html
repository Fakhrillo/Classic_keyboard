<title>Typewriter Keys 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Gelasio:wght@500&family=Source+Serif+4:wght@500&family=Inter:wght@400;600&display=swap">
<style>
  /* Layout: one phone-width column — a sheet of paper on top, the keyboard tray pinned under it. */
  :root {
    --desk: #eceef1;
    --paper: #fbfaf6;
    --ink: #1d1d20;
    --muted: #6b6e76;
    --tray: #dbdbe3;
    --rule: #c9cbd1;
    --accent: #a8262c;
    --type: "Special Elite", "Courier New", monospace;
    --ui: Inter, system-ui, sans-serif;
  }
  body {
    background: var(--desk);
    color: var(--ink);
    font-family: var(--ui);
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .column { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--type); font-size: 1.35rem; font-weight: 400; margin: 0; }
  label { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
  input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #paper {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    min-height: 7.5rem;
    padding: 16px 18px;
    font-family: var(--type);
    font-size: 1.15rem;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #paper .hint { color: var(--muted); }
  #caret { display: inline-block; width: 0.55em; height: 1.05em; background: var(--accent); vertical-align: text-bottom; opacity: 0.75; }
  #tray {
    background: var(--tray);
    border-radius: 22px;
    overflow: hidden;
    aspect-ratio: 1.62;
    max-width: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #tray canvas { display: block; width: 100%; height: 100%; }
  p.note { margin: 0; font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
</style>

<div class="column">
  <header>
    <h1>Typewriter Keys 3D</h1>
    <label for="sound"><input type="checkbox" id="sound" checked> Sound</label>
  </header>
  <div id="paper" aria-live="polite"><span id="typed"></span><span id="caret"></span><span class="hint" id="hint"> tap the keys below</span></div>
  <div id="tray"></div>
  <p class="note">Design prototype for the Android keyboard. Letters, shift, space, backspace and return work; 123 and the smiley only animate.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search), BARE = +Q.get('bare') || 0, BLANK = Q.has('blank');
  const tray = document.getElementById('tray');
  if (BARE) { document.body.style.cssText = 'margin:0;padding:0'; document.querySelector('.column').style.cssText = 'max-width:none;margin:0;display:block'; tray.style.cssText = 'position:fixed;left:0;top:0;border-radius:0;aspect-ratio:auto;max-width:none;width:' + BARE + 'px;height:' + Math.round(BARE / 1.62) + 'px'; }
  const typedEl = document.getElementById('typed');
  const hintEl = document.getElementById('hint');
  const soundEl = document.getElementById('sound');

  // ---- layout, measured from the reference video (unit = one key pitch) -----
  const ROW = 1.171, D = 0.915, CAP_Z = 0.58, CORNER = 0.43;
  const INK = '#d2d1c0';
  const L = (label, cx) => ({ label, cx });
  const rows = [
    'QWERTYUIOP'.split('').map((c, i) => L(c, 0.5 + i)),
    'ASDFGHJKL'.split('').map((c, i) => L(c, 0.975 + 1.009 * i)),
    [{ icon: 'shift', cx: 0.71, w: 1.34, neck: 0.04 }].concat('ZXCVBNM'.split('').map((c, i) => L(c, 1.987 + 1.0075 * i)), [{ icon: 'backspace', cx: 9.29, w: 1.34, red: true, neck: -0.07 }]),
    [{ label: '123', cx: 0.71, w: 1.34 }, { icon: 'emoji', cx: 1.973 }, { icon: 'space', cx: 5.02, w: 4.87 }, { icon: 'enter', cx: 8.77, w: 2.39 }],
  ];

  // ---- renderer ------------------------------------------------------------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(BARE ? 1 : Math.min(window.devicePixelRatio || 1, 2.5));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  tray.appendChild(renderer.domElement);

  const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdbdbe3);
  const VIEW_W = 10.78, VIEW_CY = -1.72;
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 100);
  camera.position.set(5, VIEW_CY, 40);
  camera.lookAt(5, VIEW_CY, 0);

  // Studio reflections for the metal: a dim ceiling, a bright horizon and floor, and two soft boxes up-left.
  // Looking straight down, flat tops mirror the ceiling and every rounded edge picks up the bright horizon.
  (function () {
    const env = new THREE.Scene();
    const c = document.createElement('canvas'); c.width = 16; c.height = 256;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
    [[0, '#56565a'], [0.28, '#3c3c40'], [0.41, '#5e5e63'], [0.47, '#c8c8ce'], [0.5, '#f4f4f8'], [1, '#dcdce4']].forEach(st => gr.addColorStop(st[0], st[1]));
    g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
    const dome = new THREE.Mesh(new THREE.SphereGeometry(30, 32, 24), new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide }));
    dome.rotation.x = Math.PI / 2; env.add(dome);
    const panel = (w, h, x, y, z, v) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(v, v, v), side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
    };
    panel(6, 6, -5, 5, 10, 1.6);
    panel(14, 5, -12, 8, 4, 2.2);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, 0.035).texture;
  })();

  // Key light from the upper left, split into a cluster so the shadows fall soft and long to the lower right.
  scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 0.45));
  const JIT = [[0, 0], [1.5, 0.5], [-1.5, -0.5], [0.5, -1.5], [-0.5, 1.5], [1.1, 1.1], [-1.1, -1.1], [1.9, -1.2], [-1.9, 1.2]];
  JIT.forEach(o => {
    const sun = new THREE.DirectionalLight(0xffffff, 0.73 / JIT.length);
    sun.position.set(5 - 3.6 + o[0] * 0.85, VIEW_CY + 5.6 + o[1] * 0.85, 8);
    sun.target.position.set(5, VIEW_CY, 0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 6, bottom: -6, near: 1, far: 30 });
    sun.shadow.bias = -0.0025;
    sun.shadow.radius = 4;
    scene.add(sun, sun.target);
  });

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: lin(0xdbdbe3), roughness: 1, metalness: 0, envMapIntensity: 0 }));
  ground.receiveShadow = true;
  scene.add(ground);

  // Ambient occlusion under the mechanism: the ground between the levers sits in deep shade.
  (function () {
    const c = document.createElement('canvas'); c.width = 512; c.height = 384;
    const g = c.getContext('2d');
    g.filter = 'blur(16px)'; g.fillStyle = '#000';
    const X = x => (x + 1) / 12 * 512, Y = y => (2.5 - y) / 9 * 384;
    g.fillRect(X(1.8), Y(0.45), X(8.2) - X(1.8), Y(-3.7) - Y(0.45));
    g.fillRect(X(0.5), Y(-0.9), X(9.5) - X(0.5), Y(-3.6) - Y(-0.9));
    const m = new THREE.Mesh(new THREE.PlaneGeometry(12, 9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0.42, depthWrite: false }));
    m.position.set(5, -2, 0.004); scene.add(m);
  })();

  // ---- materials -----------------------------------------------------------
  const std = (color, metalness, roughness, env) => new THREE.MeshStandardMaterial({ color: lin(color), metalness, roughness, envMapIntensity: env });
  const rimMat = std(0x8a8b8f, 1, 0.28, 1);
  const bodyMat = std(0x0e0e10, 0.1, 0.8, 0.1);
  const neckMat = std(0x4c4d50, 1, 0.3, 1);
  const barMat = std(0x707175, 1, 0.34, 1);
  const lineMat = std(0x9a9b9e, 0.2, 0.6, 0.3);
  const edgeMat = std(0x1d1d1f, 0.2, 0.6, 0.2);
  const slugMat = std(0x0b0c0f, 0.1, 0.9, 0.05);

  function rrect(w, h, r, inset, target) {
    const hw = w / 2 - inset, hh = h / 2 - inset, rr = Math.max(0.005, Math.min(r - inset, hw, hh));
    const s = target || new THREE.Shape();
    s.moveTo(hw - rr, -hh);
    s.absarc(hw - rr, -hh + rr, rr, -Math.PI / 2, 0, false);
    s.absarc(hw - rr, hh - rr, rr, 0, Math.PI / 2, false);
    s.absarc(-hw + rr, hh - rr, rr, Math.PI / 2, Math.PI, false);
    s.absarc(-hw + rr, -hh + rr, rr, Math.PI, Math.PI * 1.5, false);
    s.closePath();
    return s;
  }
  const shadowed = m => { m.castShadow = true; return m; };
  // A flat metal strip lying on the XY plane, running from y0 up to y1.
  function strip(x, y0, y1, w, z, mat, thick) {
    const g = new THREE.ExtrudeGeometry(rrect(w, y1 - y0, w / 2, 0.02), { depth: thick || 0.03, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 4, curveSegments: 8 });
    const m = shadowed(new THREE.Mesh(g, mat));
    m.position.set(x, (y0 + y1) / 2, z);
    return m;
  }
  function rod(x, y0, y1, r, z, mat) {
    const m = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(r, r, y1 - y0, 12), mat));
    m.position.set(x, (y0 + y1) / 2, z);
    return m;
  }

  const FONT = '500 100px Gelasio, Georgia, "Noto Serif", serif';
  let capRatio = 0.7;
  function faceTexture(key, fw, fh) {
    const H = 320, U = H / fh, W = Math.round(fw * U);   // U = pixels per layout unit
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = key.red ? '#480e1a' : '#1d1d1f'; g.fillRect(0, 0, W, H);
    const ink = key.red ? '#e2bcc0' : INK;
    g.fillStyle = ink; g.strokeStyle = ink; g.lineCap = 'round'; g.lineJoin = 'round';
    if (BLANK) { const bt = new THREE.CanvasTexture(c); bt.encoding = THREE.sRGBEncoding; return bt; }
    g.translate(W / 2, H / 2);
    g.lineWidth = 0.03 * U;
    const path = pts => { g.beginPath(); pts.forEach((p, i) => g[i ? 'lineTo' : 'moveTo'](p[0] * U, p[1] * U)); };
    const round = (pts, rad, closed) => {
      const n = pts.length; g.beginPath();
      if (closed) g.moveTo((pts[0][0] + pts[1][0]) / 2 * U, (pts[0][1] + pts[1][1]) / 2 * U); else g.moveTo(pts[0][0] * U, pts[0][1] * U);
      for (let i = 1; i < (closed ? n + 1 : n - 1); i++) { const a = pts[i % n], b = pts[(i + 1) % n]; g.arcTo(a[0] * U, a[1] * U, b[0] * U, b[1] * U, rad * U); }
      if (closed) g.closePath(); else g.lineTo(pts[n - 1][0] * U, pts[n - 1][1] * U);
    };
    if (key.label) {
      const cap = (key.label.length > 1 ? 0.32 : 0.365) * U;
      g.font = key.label.length > 1 ? '500 ' + (cap / 0.67) + 'px "Source Serif 4", Georgia, serif' : FONT.replace('100px', (cap / capRatio) + 'px');
      g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      g.fillText(key.label, 0, cap / 2);
    } else if (key.icon === 'shift') {
      path([[0, -0.23], [0.22, -0.01], [0.105, -0.01], [0.105, 0.23], [-0.105, 0.23], [-0.105, -0.01], [-0.22, -0.01]]);
      g.closePath(); g.stroke();
    } else if (key.icon === 'backspace') {
      round([[-0.265, 0], [-0.1, -0.195], [0.265, -0.195], [0.265, 0.195], [-0.1, 0.195]], 0.05, true); g.stroke();
      path([[0.01, -0.075], [0.16, 0.075]]); g.stroke(); path([[0.16, -0.075], [0.01, 0.075]]); g.stroke();
    } else if (key.icon === 'enter') {
      g.lineWidth = 0.034 * U;
      g.lineWidth = 0.038 * U;
      round([[0.07, -0.21], [0.25, -0.21], [0.25, 0.09], [-0.24, 0.09]], 0.06, false); g.stroke();
      path([[-0.1, -0.06], [-0.25, 0.09], [-0.1, 0.24]]); g.stroke();
    } else if (key.icon === 'emoji') {
      g.beginPath(); g.arc(0, 0, 0.2 * U, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.arc(0, 0.035 * U, 0.125 * U, 0, Math.PI); g.quadraticCurveTo(0, 0.085 * U, 0.125 * U, 0.035 * U); g.fill();
      g.beginPath(); g.arc(-0.075 * U, -0.065 * U, 0.026 * U, 0, 7); g.arc(0.075 * U, -0.065 * U, 0.026 * U, 0, 7); g.fill();
    }
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // ---- build ---------------------------------------------------------------
  const keys = [], pickable = [];
  const RIM = 0.084;   // width of the metal ring around each cap

  function buildKey(key, row) {
    const w = key.w || D, r = key.w ? CORNER : D / 2;
    const group = new THREE.Group();
    group.position.set(key.cx, -row * ROW, CAP_Z);

    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rrect(w, D, r, 0.004), { depth: 0.2, bevelEnabled: false, curveSegments: 24 }), bodyMat);
    body.position.z = -0.24;
    // Half-round ring: a thin band with a deep bevel on both sides.
    const mid = RIM / 2, half = 0.006;
    const rimShape = rrect(w, D, r, mid - half);
    rimShape.holes.push(rrect(w, D, r, mid + half, new THREE.Path()));
    const rim = new THREE.Mesh(new THREE.ExtrudeGeometry(rimShape, { depth: 0.01, bevelEnabled: true, bevelThickness: 0.04, bevelSize: mid - half - 0.002, bevelSegments: 10, curveSegments: 32 }), rimMat);
    rim.position.z = -0.045;
    const ring = (a, b, mat, z) => {
      const sh = rrect(w, D, r, a); sh.holes.push(rrect(w, D, r, b, new THREE.Path()));
      const m = new THREE.Mesh(new THREE.ShapeGeometry(sh, 32), mat); m.position.z = z; return m;
    };
    const edge = ring(0, 0.02, edgeMat, -0.04);
    const line = ring(RIM - 0.03, RIM - 0.01, lineMat, 0.009);
    const fin = RIM + 0.008;
    const faceGeo = new THREE.ShapeGeometry(rrect(w, D, r, fin), 32);
    const fw = w - 2 * fin, fh = D - 2 * fin;
    const uv = faceGeo.attributes.uv, pos = faceGeo.attributes.position;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / fw + 0.5, pos.getY(i) / fh + 0.5);
    const face = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({ map: faceTexture(key, fw, fh), roughness: 0.85, metalness: 0, envMapIntensity: 0.12 }));
    face.position.z = -0.03;
    const parts = [body, rim, face];
    if (row < 3) {
      // The cap's own neck: a dark rod leaving the bottom edge toward the row below.
      const edge = key.label === 'Q' ? 0.04 : key.label === 'P' ? -0.03 : 0;
      const neck = rod(key.neck || edge, -ROW * (row === 0 ? 1.0 : 0.95), -D / 2 + 0.06, 0.05, -0.3, neckMat);
      parts.push(neck);
    }
    parts.forEach(m => { m.userData.key = key; group.add(m); });
    shadowed(body); shadowed(rim);
    pickable.push(body, rim, face);
    scene.add(group);
    Object.assign(key, { group, face, row, cy: -row * ROW, p: 0, down: 0 });
    keys.push(key);
  }

  function build() {
    rows.forEach((row, ri) => row.forEach(k => buildKey(k, ri)));

    // Type bars: 17 flat strips running behind every row. Each curls under at the top, which reads as a black slot.
    const BAR_N = 17, BAR_X0 = 1.954, BAR_STEP = 0.378, BOTTOM = -3 * ROW;
    const hookGeo = new THREE.ExtrudeGeometry(rrect(0.185, 0.56, 0.075, 0), { depth: 0.04, bevelEnabled: false, curveSegments: 8 });
    const slugGeo = new THREE.ExtrudeGeometry(rrect(0.14, 0.515, 0.055, 0), { depth: 0.04, bevelEnabled: false, curveSegments: 8 });
    for (let i = 0; i < BAR_N; i++) {
      const sx = BAR_X0 + BAR_STEP * i, par = 0.017 * (sx - 5);   // parallax between slot and strip, as in the reference
      const slug = new THREE.Mesh(slugGeo, slugMat); slug.position.set(sx, 1.05, 0.222);
      const hook = shadowed(new THREE.Mesh(hookGeo, barMat)); hook.position.set(sx, 1.05, 0.2);
      scene.add(slug, hook, strip(sx + par, BOTTOM, 1.235, 0.115, 0.27, barMat, 0.035));
    }

    // Long levers that stay visible between the keys, with their pivot clamps.
    const lever = (x, y0, y1) => scene.add(strip(x, y0, y1, 0.105, 0.27, barMat, 0.03));
    lever(0.41, -3 * ROW + 0.3, -ROW + 0.12);
    lever(1.5, -3 * ROW - 0.05, -0.3);
    lever(3.48, -3 * ROW + 0.3, -0.3);
    lever(6.47, -3 * ROW + 0.3, -0.3);
    lever(8.48, -3 * ROW + 0.4, -0.3);
    lever(9.54, -2 * ROW, -ROW + 0.12);
    const clamp = (x, y, s) => {
      const a = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.09 * s, 0.09 * s, 0.2 * s, 14), rimMat)); a.position.set(x, y, 0.24);
      const b = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.07 * s, 0.07 * s, 0.34 * s, 12), rimMat)); b.position.set(x, y, 0.24);
      scene.add(a, b);
    };
    [[0.38, -ROW + 0.03, 1], [1.5, -ROW - 0.2, 0.9], [3.49, -ROW - 0.2, 0.9], [6.5, -ROW - 0.2, 0.9], [8.5, -ROW - 0.2, 0.9], [9.56, -ROW + 0.03, 0.7],
     [1.5, -2 * ROW + 0.225, 1], [3.47, -2 * ROW + 0.225, 1], [8.48, -2 * ROW + 0.225, 1], [1.47, -3 * ROW + 0.09, 0.7]].forEach(c => clamp(c[0], c[1], c[2]));

    keys.forEach(k => { k.reach = k.row === 3 ? 0.07 : 0.13; });

    // Space bar linkage: four hangers ending in long eyes, and two riveted hinge plates with ribbed barrels.
    const space = keys.find(k => k.icon === 'space');
    const barBottom = space.cy - D / 2;
    [3.04, 4.22, 6.1, 6.88].forEach(x => {
      scene.add(strip(x, barBottom - 0.36, barBottom + 0.2, 0.09, 0.2, barMat, 0.03));
      const eye = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.022, 8, 20), rimMat));
      eye.scale.set(1.15, 3.3, 1.4); eye.position.set(x, barBottom - 0.47, 0.22); scene.add(eye);
    });
    [[3.15, 3.83], [6.15, 6.79]].forEach(b => {
      const w = b[1] - b[0], cx = (b[0] + b[1]) / 2;
      const plate = shadowed(new THREE.Mesh(new THREE.ExtrudeGeometry(rrect(w, 0.36, 0.06, 0), { depth: 0.05, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 2 }), barMat));
      plate.position.set(cx, barBottom - 0.11, 0.12); scene.add(plate);
      [-1, 1].forEach(sd => {
        const rivet = new THREE.Mesh(new THREE.SphereGeometry(0.036, 12, 8), rimMat);
        rivet.scale.z = 0.5; rivet.position.set(cx + sd * (w / 2 - 0.085), barBottom - 0.07, 0.185); scene.add(rivet);
      });
      [-0.1, 0, 0.1].forEach((dx, i) => {
        const rr = i === 1 ? 0.042 : 0.052;
        const rib = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, 0.3, 12), rimMat));
        rib.position.set(cx + dx, barBottom - 0.13, 0.2); scene.add(rib);
      });
    });
  }

  // ---- camera fit ----------------------------------------------------------
  function resize() {
    const w = tray.clientWidth, h = tray.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    const hw = VIEW_W / 2, hh = hw * h / w;
    Object.assign(camera, { left: -hw, right: hw, top: hh, bottom: -hh });
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(tray);
  resize();

  // ---- typing --------------------------------------------------------------
  let text = '', shift = false, audio = null;

  function click(kind) {
    if (!soundEl.checked) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime, dur = kind === 'bell' ? 0.7 : 0.07;
      const buf = audio.createBuffer(1, audio.sampleRate * 0.07, audio.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audio.sampleRate * 0.006));
      const n = audio.createBufferSource(); n.buffer = buf;
      const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = kind === 'space' ? 900 : 2600 + Math.random() * 500;
      const g = audio.createGain(); g.gain.value = 0.6;

      k.face.material.color.setScalar(1 - 0.45 * p);

  }

  const fontReady = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('500 100px Gelasio'), document.fonts.load('500 100px "Source Serif 4"')]).catch(() => {}) : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(() => { const mc = document.createElement('canvas').getContext('2d'); mc.font = FONT; const mm = mc.measureText('H'); if (mm.actualBoundingBoxAscent) capRatio = mm.actualBoundingBoxAscent / 100; build(); window.__ready = true; requestAnimationFrame(frame); }).catch(e => console.error('build failed: ' + (e && e.stack || e)));
